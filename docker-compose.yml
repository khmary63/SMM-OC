# MARIA SMM OS — полное развёртывание на одном сервере:
# веб-приложение + n8n + микросервисы. База — облачный Supabase.
# Переменные берутся из файла .env рядом с этим файлом.

services:
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        - NEXT_PUBLIC_SUPABASE_URL=${NEXT_PUBLIC_SUPABASE_URL}
        - NEXT_PUBLIC_SUPABASE_ANON_KEY=${NEXT_PUBLIC_SUPABASE_ANON_KEY}
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"
      - "172.17.0.1:3000:3000"
    environment:
      - NEXT_PUBLIC_SUPABASE_URL=${NEXT_PUBLIC_SUPABASE_URL}
      - NEXT_PUBLIC_SUPABASE_ANON_KEY=${NEXT_PUBLIC_SUPABASE_ANON_KEY}
      - SUPABASE_SERVICE_ROLE_KEY=${SUPABASE_SERVICE_ROLE_KEY}
      - AI_PROVIDER=${AI_PROVIDER:-anthropic}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - AI_BASE_URL=${AI_BASE_URL}
      - AI_API_KEY=${AI_API_KEY}
      - AI_MODEL=${AI_MODEL:-claude-sonnet-5}
      - AI_IMAGE_MODEL=${AI_IMAGE_MODEL:-dall-e-3}
      - APP_BASE_URL=${APP_BASE_URL:-http://localhost}
      - N8N_WEBHOOK_URL=http://n8n:5678/webhook/smm-os/jobs
      - N8N_WEBHOOK_TOKEN=${N8N_WEBHOOK_TOKEN}
      - VIDEO_RENDER_URL=http://video-worker:8082
      - VIDEO_RENDER_TOKEN=${VIDEO_RENDER_TOKEN}
    depends_on:
      - n8n
      - video-worker
    # Supabase (Cloudflare-фронтед) периодически недоступен напрямую с этого
    # сервера — тот же класс блокировки, что и Telegram (см. tg-proxy-forward
    # и supabase-proxy-forward ниже). Ломает вообще всё приложение (auth,
    # запросы, storage), поэтому резолвим на форвардер так же, как n8n.
    extra_hosts:
      - "${NEXT_PUBLIC_SUPABASE_HOST}:172.18.0.10"
    networks:
      default:
      deploy_default:
        aliases:
          - maria-web
  n8n:
    image: n8nio/n8n:latest
    restart: unless-stopped
    # Сеть хоста: раньше нужна была для IPv6 к Telegram; сейчас IPv6 с этого
    # сервера не маршрутизируется ни до Telegram, ни до Google (проверено
    # curl -6 напрямую с хоста) — оставлено host networking ради простоты
    # доступа к соседним сервисам через localhost.
    # Порт 5678 биндится напрямую; доступ к другим сервисам — через localhost.
    network_mode: host
    # Telegram Bot API недоступен с этого сервера напрямую (см. tg-proxy-forward
    # ниже). При network_mode: host контейнер не резолвит имена соседних
    # compose-сервисов, поэтому подменяем адрес напрямую на статический IP
    # форвардера — единственный надёжный способ вместо per-node "Proxy" в
    # HTTP Request node (axios не тоннелирует HTTPS через HTTP-прокси).
    extra_hosts:
      - "api.telegram.org:172.18.0.9"
    environment:
      - N8N_HOST=${N8N_HOST:-localhost}
      - N8N_PORT=5678
      - WEBHOOK_URL=${N8N_PUBLIC_BASE_URL:-http://localhost:5678}
      # Доступ по HTTP без домена; при переходе на HTTPS-домен убрать
      - N8N_SECURE_COOKIE=false
      # Разрешить $env.* в выражениях workflow (WORKER_NAME, MAX_API_BASE_URL и др.)
      - N8N_BLOCK_ENV_ACCESS_IN_NODE=false
      # JS Task Runner (внешний sandbox) по умолчанию блокирует require() встроенных
      # модулей Node. HMAC-подпись webhook-payload'ов (WF-CORE-002/004 и все job-обвязки)
      # требует crypto — разрешаем явно.
      - NODE_FUNCTION_ALLOW_BUILTIN=crypto
      # --dns-result-order=ipv6first убран 2026-08-13: IPv6 с этого сервера
      # больше не маршрутизируется до Google, из-за чего Calendar/Gmail OAuth
      # и другие dual-stack хосты падали с ENETUNREACH (fetch/undici не
      # делает fallback на IPv4 сам). Telegram Bot API по-прежнему недоступен
      # напрямую ни по IPv4, ни по IPv6 — для него нужен отдельный прокси,
      # обычный DNS-порядок это не меняет.
      - GENERIC_TIMEZONE=${TZ:-Europe/Moscow}
      - N8N_WEBHOOK_TOKEN=${N8N_WEBHOOK_TOKEN}
      - WORKER_NAME=n8n-main
      # workflow-переменные (см. n8n/README.md); host mode → соседи через localhost
      - SUPABASE_URL=${NEXT_PUBLIC_SUPABASE_URL}
      - SUPABASE_SERVICE_ROLE_KEY=${SUPABASE_SERVICE_ROLE_KEY}
      # Порт 80 на хосте занят Caddy — без :3000 запросы уходили не туда.
      - APP_INTERNAL_URL=http://127.0.0.1:3000
      - VCRU_API_BASE=${VCRU_API_BASE:-https://api.vc.ru/v1.9}
      - TELEGRAM_STATS_URL=http://127.0.0.1:8081
      - TELEGRAM_STATS_TOKEN=${TELEGRAM_STATS_TOKEN}
      - VIDEO_RENDER_URL=http://127.0.0.1:8082
      - VIDEO_RENDER_TOKEN=${VIDEO_RENDER_TOKEN}
      - MAX_API_BASE_URL=${MAX_API_BASE_URL:-https://botapi.max.ru}
      # Production: сокращаем хранение execution data (§7 реестра workflow)
      - EXECUTIONS_DATA_SAVE_ON_SUCCESS=none
      - EXECUTIONS_DATA_SAVE_ON_ERROR=all
      - EXECUTIONS_DATA_PRUNE=true
      - EXECUTIONS_DATA_MAX_AGE=168
    volumes:
      - n8n_data:/home/node/.n8n

  telegram-collector:
    build: ./services/telegram-collector
    restart: unless-stopped
    ports:
      - "8081:8081"
    environment:
      - TELEGRAM_API_ID=${TELEGRAM_API_ID}
      - TELEGRAM_API_HASH=${TELEGRAM_API_HASH}
      - TELEGRAM_SESSION=${TELEGRAM_SESSION}
      - TELEGRAM_STATS_TOKEN=${TELEGRAM_STATS_TOKEN}

  video-worker:
    build: ./services/video-worker
    restart: unless-stopped
    ports:
      - "8082:8082"
    environment:
      - VIDEO_RENDER_TOKEN=${VIDEO_RENDER_TOKEN}

  # Локальный Whisper (OpenAI-совместимый /v1/audio/transcriptions) — шлюз
  # Vsellm транскрибацию не поддерживает (нет ни одной STT-модели в каталоге),
  # а прямые OpenAI/Groq заблокированы по гео с этого сервера. Используется
  # нодой "Transcribe a recording" в workflow MANAGER MAX через отдельный
  # credential с baseURL на этот сервис. Порт только на loopback — без auth.
  whisper:
    image: fedirz/faster-whisper-server:latest-cpu
    restart: unless-stopped
    ports:
      - "127.0.0.1:8083:8000"
    environment:
      - WHISPER__MODEL=Systran/faster-whisper-small
      - WHISPER__INFERENCE_DEVICE=cpu
      - WHISPER__COMPUTE_TYPE=int8
    volumes:
      - whisper_cache:/root/.cache/huggingface

  # Прозрачный TCP-форвардер до api.telegram.org:443 через внешний SOCKS5-прокси
  # (Bot API не маршрутизируется с этого сервера напрямую ни по IPv4, ни по
  # IPv6). Работает на уровне TCP, а не HTTP-прокси — TLS/SNI остаётся
  # настоящим (api.telegram.org), поэтому сертификат проходит проверку как
  # обычно. n8n (network_mode: host) резолвит api.telegram.org на его
  # статический IP через extra_hosts выше.
  # IP фиксируется отдельно через `docker network connect --ip` после
  # создания (не через compose ipam) — сеть maria-smm-os_default общая
  # с посторонним контейнером pgadmin, и compose не может её пересоздать.
  tg-proxy-forward:
    image: ginuerzh/gost
    restart: unless-stopped
    command: ["-L=tcp://:443/api.telegram.org:443", "-F=${TG_PROXY_URL}"]

  # То же самое для Supabase (Cloudflare-фронтед) — периодически недоступен
  # с этого сервера напрямую тем же классом блокировки, что и Telegram,
  # что ломает вход/сессии/запросы во всём приложении. IP фиксируется через
  # `docker network connect --ip` после создания, как у tg-proxy-forward.
  supabase-proxy-forward:
    image: ginuerzh/gost
    restart: unless-stopped
    command: ["-L=tcp://:443/${NEXT_PUBLIC_SUPABASE_HOST}:443", "-F=${TG_PROXY_URL}"]

volumes:
  n8n_data:
  whisper_cache:

networks:
  deploy_default:
    external: true
    name: deploy_default
